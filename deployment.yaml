apiVersion: apps/v1
kind: Deployment
metadata:
  name: nginx-prod-deploy
  labels:
    app: nginx-app-prod
spec:
  replicas: 3
  selector:
    matchLabels:
      app: nginx-prod
  template:
    metadata:
      labels:
        app: nginx-prod
    spec:
      containers:
        - name: nginx-container
          image: nginx
          ports:
            - containerPort: 80
