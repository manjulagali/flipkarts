apiVersion: apps/v1
kind: Deployment
metadata:
  name: flipkarts-deploy
  labels:
    app: flipkarts-app
spec:
  replicas: 3
  selector:
    matchLabels:
      app: flipkarts-app
  template:
    metadata:
      labels:
        app: flipkarts-app
    spec:
      containers:
        - name: flipkarts-container
          image: 9144/flipkarts102-img
          ports:
            - containerPort: 8080
          command: ["/bin/sh:]"]
          args: ["-c", "/root/apache-tomcat-11.0.26/bin/startup.sh; while true; do sleep 1; done;"]
