apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: nginx-ingress
  namespace: ingress-demo
  alb.ingress.kubernetes.io/scheme: internet-facing
  alb.ingress.kubernetes.io/target-type: ip
spec:
  ingressCLassName: alb
  rules:
    - http:
        path: /
        pathType: Prefix
        backend:
          service:
            name: ingnex-service
            port:
              number: 80
